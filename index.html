<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Poorvi Math"><title>Poorvi Math</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#151515;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.app{max-width:1150px;margin:auto;padding:12px}.card{background:white;border:1px solid #d7d7d7;border-radius:14px;padding:14px;margin:10px 0}h1{font-size:24px;margin:0}.muted{color:#687078;font-size:13px}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}label{display:block;font-size:12px;font-weight:bold;margin-bottom:4px}select,button{font:inherit}select{width:100%;padding:9px;border:1px solid #bbb;border-radius:8px;background:white}button{border:0;border-radius:9px;padding:10px 14px;font-weight:bold}.primary{background:#2563eb;color:#fff}.secondary{background:#e8ebef}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.timer{font-size:27px;font-weight:800}.warn{color:#c62828}.sheet{border:1px solid #aaa}.head{padding:12px;border-bottom:1px solid #777}.title{text-align:center;font:700 21px Georgia,serif}.info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:10px;font:13px Georgia,serif}.line{display:inline-block;border-bottom:1px solid #444;width:100px}.grid{display:grid;grid-template-columns:repeat(10,1fr)}.cell{height:72px;border-right:1px solid #bbb;border-bottom:1px solid #bbb;display:flex;align-items:center;justify-content:center}.cell:nth-child(10n){border-right:0}.q{font:18px Georgia,serif;white-space:nowrap}.ans{width:46px;border:0;border-bottom:1px solid #444;background:transparent;outline:0;text-align:center;font:18px Georgia,serif}.fb{height:12px;text-align:center;font-size:10px}.ok{color:#16803c}.bad{color:#c62828}.hidden{display:none}.score{text-align:center;font-size:42px;font-weight:900}.stats{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.stat{background:#eef0f2;padding:7px 13px;border-radius:9px}.stat b{display:block;font-size:19px}
@media(max-width:850px){.controls{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.controls{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(5,1fr)}.cell:nth-child(10n){border-right:1px solid #bbb}.cell:nth-child(5n){border-right:0}.cell{height:78px}.q{font-size:14px}.ans{width:38px;font-size:15px}.info{font-size:11px;gap:4px}.line{width:60px}}
</style></head><body><div class="app">
<div style="margin-bottom:10px"><h1>📚 Poorvi Math Practice</h1><div class="muted">Daily school-style worksheets • iPad friendly</div></div>
<div class="card"><b>Today's Edition</b><div class="controls" style="margin-top:10px">
<div><label>Operation</label><select id="op"><option value="addition">Addition</option><option value="subtraction">Subtraction</option><option value="multiplication">Multiplication</option><option value="division">Division</option><option value="mixed">Mixed</option></select></div>
<div><label>Questions</label><select id="count"><option>100</option><option>50</option><option>25</option></select></div>
<div><label>Format</label><select id="format"><option>Side-by-side</option><option>Vertical</option></select></div>
<div><label>Timer</label><select id="mins"><option value="4">4 minutes</option><option value="5">5 minutes</option><option value="0">No timer</option></select></div>
<div><label>Edition</label><select id="edition"><option>Random</option><option>More regrouping</option></select></div></div>
<div class="actions"><button class="primary" onclick="newEdition()">✨ New Edition</button><button class="secondary" onclick="start()">▶ Start</button><button class="secondary" onclick="finish()">✓ Score</button></div></div>
<div class="card"><b>Timer</b><span class="timer" id="timer" style="float:right">4:00</span></div>
<div class="card"><div class="sheet" id="sheet"></div></div>
<div class="card hidden" id="result"><div style="text-align:center"><div class="muted">Today's Result</div><div class="score" id="score"></div><p id="msg"></p><div class="stats"><div class="stat"><b id="acc"></b>Accuracy</div><div class="stat"><b id="time"></b>Time</div></div><div class="actions" style="justify-content:center"><button class="primary" onclick="newEdition()">New Edition</button></div></div></div>
<div class="card"><b>Weekly Progress</b><div id="hist" class="muted" style="margin-top:7px"></div></div>
</div>
<script>
let qs=[],started=false,done=false,left=240,tid=null,startedAt=0,$=x=>document.getElementById(x),R=n=>Math.floor(Math.random()*n);
function make(o,ed){if(o=="mixed")o=["addition","subtraction","multiplication","division"][R(4)];let a,b,ans;if(o=="addition"){a=R(10);b=R(10);if(ed=="More regrouping"&&a+b<10)b=Math.min(9,10-a+R(a+1));ans=a+b}else if(o=="subtraction"){a=R(10);b=R(a+1);ans=a-b}else if(o=="multiplication"){a=R(10);b=R(10);ans=a*b}else{b=1+R(9);ans=R(10);a=b*ans}return{a,b,ans,o}}
function sym(o){return{o:""}[o]||({addition:"+",subtraction:"−",multiplication:"×",division:"÷"})[o]}
function newEdition(){clearInterval(tid);started=false;done=false;left=(+$("mins").value||0)*60;timer();qs=Array.from({length:+$("count").value},()=>make($("op").value,$("edition").value));qs.sort(()=>Math.random()-.5);render();$("result").classList.add("hidden")}
function render(){let vertical=$("format").value=="Vertical",title=$("op").value=="mixed"?"Mixed Math Practice":$("op").value[0].toUpperCase()+$("op").value.slice(1)+" Practice";$("sheet").innerHTML='<div class="head"><div class="title">'+title+'</div><div class="info"><div>Name: <span class="line"></span></div><div>Date: <span class="line"></span></div><div>Score: <span class="line"></span> / '+qs.length+'</div></div></div>';let g=document.createElement("div");g.className="grid";qs.forEach((q,i)=>{let c=document.createElement("div");c.className="cell";c.innerHTML='<div><div class="q">'+q.a+' '+sym(q.o)+' '+q.b+' = <input class="ans" inputmode="numeric" data-i="'+i+'"></div><div class="fb" id="f'+i+'"></div></div>';g.appendChild(c)});$("sheet").appendChild(g)}
function start(){if(started)return;started=true;done=false;startedAt=Date.now();left=(+$("mins").value||0)*60;timer();if(left)tid=setInterval(()=>{left--;timer();if(left<=0)finish(true)},1000)}
function timer(){let m=Math.floor(left/60),s=left%60;$("timer").textContent=m+":"+String(s).padStart(2,"0");$("timer").classList.toggle("warn",left>0&&left<=30)}
function finish(timeup=false){if(done)return;done=true;started=false;clearInterval(tid);let n=0;document.querySelectorAll(".ans").forEach((e,i)=>{let ok=e.value.trim()!==""&&+e.value===qs[i].ans,f=$("f"+i);f.textContent=ok?"✓":(e.value.trim()===""?"•":"✗");f.className="fb "+(ok?"ok":"bad");if(ok)n++});let total=qs.length,a=Math.round(n/total*100),elapsed=$("mins").value=="0"?Math.round((Date.now()-startedAt)/1000):+$("mins").value*60-left;$("score").textContent=n+" / "+total;$("acc").textContent=a+"%";$("time").textContent=Math.floor(elapsed/60)+":"+String(elapsed%60).padStart(2,"0");$("msg").textContent=timeup?"Time's up!":a==100?"🎉 Perfect!":a>=90?"⭐ Excellent!":"👍 Keep practicing!";let h=JSON.parse(localStorage.getItem("poorviMathHistory")||"[]");h.unshift({d:new Date().toLocaleDateString(),a,n,total});localStorage.setItem("poorviMathHistory",JSON.stringify(h.slice(0,7)));$("result").classList.remove("hidden");history()}
function history(){let h=JSON.parse(localStorage.getItem("poorviMathHistory")||"[]");$("hist").innerHTML=h.length?h.map(x=>x.d+": <b>"+x.a+"%</b> ("+x.n+"/"+x.total+")").join(" • "):"No completed tests yet."}
newEdition();history();
</script></body></html>
