<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Poorvi Math</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,Arial;color:#17191c}.app{max-width:1150px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin:10px 0}h1{font-size:24px;margin:0 0 3px}.muted{color:#68717a;font-size:13px}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}select,input,button{font:inherit}select{width:100%;padding:9px;border:1px solid #bbb;border-radius:8px;background:#fff}button{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.primary{background:#2563eb;color:#fff}.secondary{background:#e8ebef}.danger{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.timer{font-size:28px;font-weight:800}.warn{color:#c62828}.sheet{border:1px solid #aaa}.head{padding:12px;border-bottom:1px solid #777}.title{text-align:center;font:bold 21px Georgia}.info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;font:13px Georgia;margin-top:10px}.line{display:inline-block;width:90px;border-bottom:1px solid #444}.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));overflow:hidden}.cell{height:70px;min-width:0;border-right:1px solid #bbb;border-bottom:1px solid #bbb;display:flex;align-items:center;justify-content:center;text-align:center}.cell{border-right:1px solid #bbb}.cell:last-child{border-right:0}.q{font:clamp(11px,1.6vw,17px) Georgia;white-space:nowrap}.pad{width:clamp(42px,6vw,64px);height:42px;border:1px solid #aeb5bb;border-radius:6px;background:#fff;display:block;touch-action:none}.ans{width:clamp(22px,4vw,45px);border:0;border-bottom:1px solid #444;outline:0;text-align:center;background:transparent}.fb{font-size:10px;height:12px}.ok{color:#16803c}.bad{color:#c62828}.hidden{display:none!important}.score{text-align:center;font-size:42px;font-weight:900}.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.stat{background:#eef0f2;padding:7px 13px;border-radius:9px;text-align:center}.stat b{display:block;font-size:19px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{padding:7px;border:1px solid #ccc;border-radius:8px;text-align:center}.done{background:#edf9ef;border-color:#9bd0a6}.day b,.day strong{display:block}.day strong{font-size:18px}.small{font-size:10px;color:#68717a}.lock{padding:10px;background:#edf7ed;border-radius:9px;text-align:center;font-weight:700}.active #parentPanel,.active header button,.active .parentResults{display:none!important}.active .childOnly{display:block!important}
@media(max-width:800px){.controls{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.controls{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}.cell:nth-child(5n){border-right:1px solid #bbb}.cell{height:76px}.info{font-size:11px}.week{grid-template-columns:repeat(4,1fr)}.pad{width:min(64px,15vw);height:44px}.pad{width:min(64px,15vw);height:44px}}
</style><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script></head><body><div class="app" id="app">
<header style="display:flex;justify-content:space-between;align-items:center"><div><h1>📚 Poorvi Math Practice</h1><div class="muted">Parent-controlled daily test</div></div><button class="secondary" onclick="parentLogin()">🔒 Parent</button></header>

<section class="card" id="parentPanel"><b>Parent Controls</b><div class="muted">Set everything before giving the iPad to your child.</div>
<div class="controls" style="margin-top:10px">
<div><label>Operation</label><select id="op"><option value="addition">Addition</option><option value="subtraction">Subtraction</option><option value="multiplication">Multiplication</option><option value="division">Division</option><option value="mixed">Mixed</option></select></div>
<div><label>Questions</label><select id="count"><option>100</option><option>50</option><option>25</option></select></div><div><label>Answer Method</label><select id="answerMode"><option value="pencil">✏️ Apple Pencil / Handwriting</option><option value="keyboard">⌨️ Keyboard</option></select></div>
<div><label>Format</label><select id="format"><option value="horizontal">Side-by-side</option><option value="vertical">Vertical</option></select></div>
<div><label>Timer</label><select id="mins"><option value="4">4 minutes</option><option value="5">5 minutes</option><option value="0">No timer</option></select></div>
<div><label>Edition</label><select id="edition"><option value="random">Random</option><option value="regroup">More regrouping</option></select></div></div>
<div class="actions"><button class="primary" onclick="newEdition()">✨ Create Edition</button><button class="secondary" onclick="parentResults()">📊 Results</button><button class="danger" onclick="clearHistory()">Clear History</button></div></section>

<section class="card childOnly"><div class="lock">🔒 CHILD MODE — Once the test starts, all controls are locked.</div><div style="display:flex;justify-content:space-between;margin-top:10px"><b>Timer</b><span id="timer" class="timer">4:00</span></div><div class="actions"><button class="primary" id="start" onclick="startTest()">▶ Start Test</button></div></section>
<section class="card"><div id="sheet" class="sheet"></div></section>

<section class="card hidden" id="ocrStatus" style="text-align:center"><b>✏️ Reading handwriting…</b><div id="ocrProgress" class="muted" style="margin-top:5px">Preparing recognition.</div></section><section class="card hidden" id="result"><div class="score" id="score"></div><div style="text-align:center" id="msg"></div><div class="stats"><div class="stat"><b id="acc"></b>Accuracy</div><div class="stat"><b id="used"></b>Time</div><div class="stat"><b id="best"></b>Best</div></div><div class="actions parentResults" style="justify-content:center"><button class="secondary" onclick="review()">Review Mistakes</button></div><div id="mistakes" class="hidden"></div></section>

<section class="card"><b>This Week</b><div class="week" id="week"></div><div class="muted" id="summary" style="margin-top:8px"></div></section>
</div>

<script>
let qs=[],started=false,done=false,left=240,tid=null,begin=0;
const $=x=>document.getElementById(x),R=n=>Math.floor(Math.random()*n);
function sym(o){return({addition:"+",subtraction:"−",multiplication:"×",division:"÷"})[o]}
function make(o,ed){if(o==="mixed")o=["addition","subtraction","multiplication","division"][R(4)];let a,b,ans;if(o==="addition"){a=R(10);b=R(10);if(ed==="regroup"&&a+b<10)b=Math.min(9,10-a+R(a+1));ans=a+b}else if(o==="subtraction"){a=R(10);b=R(a+1);ans=a-b}else if(o==="multiplication"){a=R(10);b=R(10);ans=a*b}else{b=1+R(9);ans=R(10);a=b*ans}return{a,b,ans,o}}

function fitGrid(){
 const grid=document.querySelector(".grid"); if(!grid)return;
 const width=grid.clientWidth;
 const pencil=$("answerMode").value==="pencil";
 // Pick a practical minimum cell width so equations and Pencil boxes remain usable.
 const min=pencil?145:118;
 const cols=Math.max(1,Math.floor(width/min));
 grid.style.setProperty("--cell-min",(Math.max(1,Math.floor(width/cols)))+"px");
}
function newEdition(){if(started)return;clearInterval(tid);done=false;left=(+$("mins").value||0)*60;update();qs=Array.from({length:+$("count").value},()=>make($("op").value,$("edition").value)).sort(()=>Math.random()-.5);render();$("result").classList.add("hidden")}
function render(){let t=$("op").value==="mixed"?"Mixed Math Practice":$("op").value[0].toUpperCase()+$("op").value.slice(1)+" Practice";$("sheet").innerHTML='<div class="head"><div class="title">'+t+'</div><div class="info"><div>Name: <span class="line"></span></div><div>Date: <span class="line"></span></div><div>Score: <span class="line"></span> / '+qs.length+'</div></div></div>';let g=document.createElement("div");g.className="grid";qs.forEach((q,i)=>{let c=document.createElement("div");c.className="cell";const entry=$("answerMode").value==="pencil"?'<canvas class="pad" width="160" height="100" data-i="'+i+'" aria-label="Handwriting answer '+(i+1)+'"></canvas>':'<input class="ans" inputmode="numeric" data-i="'+i+'" aria-label="Answer '+(i+1)+'">';c.innerHTML='<div><div class="q">'+q.a+' '+sym(q.o)+' '+q.b+' = '+entry+'</div><div class="fb" id="f'+i+'"></div></div>';g.appendChild(c)});$("sheet").appendChild(g); if($("answerMode").value==="pencil")setupCanvases(); requestAnimationFrame(fitGrid)}

function setupCanvases(){
 document.querySelectorAll(".pad").forEach(canvas=>{
  const ctx=canvas.getContext("2d"),scale=window.devicePixelRatio||1;
  ctx.setTransform(scale,0,0,scale,0,0);ctx.lineWidth=2.5;ctx.lineCap="round";ctx.lineJoin="round";
  let drawing=false;
  const point=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width/scale,y:(e.clientY-r.top)*canvas.height/r.height/scale}};
  canvas.addEventListener("pointerdown",e=>{if(!started)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;let p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});
  canvas.addEventListener("pointermove",e=>{if(!drawing)return;e.preventDefault();let p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()});
  canvas.addEventListener("pointerup",()=>drawing=false);canvas.addEventListener("pointercancel",()=>drawing=false);
 });
}
function startTest(){if(started)return;started=true;begin=Date.now();left=(+$("mins").value||0)*60;update();$("app").classList.add("active");$("start").disabled=true;document.querySelector(".ans")?.focus();if(left)tid=setInterval(()=>{left--;update();if(left<=0)finish(true)},1000)}
function update(){let m=Math.floor(left/60),s=left%60;$("timer").textContent=m+":"+String(s).padStart(2,"0");$("timer").classList.toggle("warn",left&&left<=30)}
async function finish(up=false){
 if(done)return;done=true;started=false;clearInterval(tid);$("app").classList.remove("active");
 const pencil=$("answerMode").value==="pencil",elapsed=$("mins").value==="0"?Math.round((Date.now()-begin)/1000):+$("mins").value*60-left;
 if(pencil){
   $("ocrStatus").classList.remove("hidden");$("result").classList.add("hidden");
   let recognized=0,correct=0,total=qs.length;
   try{
     if(!window.Tesseract)throw new Error("OCR unavailable");
     const worker=await Tesseract.createWorker("eng",1,{logger:m=>{
       if(m && typeof m.progress==="number")$("ocrProgress").textContent="Preparing recognition… "+Math.round(m.progress*100)+"%";
     }});
     await worker.setParameters({tessedit_char_whitelist:"0123456789",tessedit_pageseg_mode:"10"});
     for(let i=0;i<total;i++){
       const c=document.querySelector('.pad[data-i="'+i+'"]'),f=$("f"+i);
       if(!c||blankCanvas(c)){f.textContent="•";f.className="fb";continue}
       $("ocrProgress").textContent="Reading answer "+(i+1)+" of "+total+"…";
       let s="";
       try{s=(await worker.recognize(c)).data.text.replace(/[^0-9]/g,"");if(s.length>2)s=s.slice(-2)}catch(e){}
       if(s)recognized++;
       const ok=s!=="" && +s===qs[i].ans;if(ok)correct++;
       f.textContent=s?(ok?"✓":"✗"):"?";
       f.className="fb "+(ok?"ok":"bad");
     }
     await worker.terminate();
     const acc=Math.round(correct/total*100);
     $("score").textContent=correct+" / "+total;$("acc").textContent=acc+"%";$("used").textContent=Math.floor(elapsed/60)+":"+String(elapsed%60).padStart(2,"0");
     let h=JSON.parse(localStorage.getItem("poorviMathHistory")||"[]");h.push({date:key(),n:correct,total,a:acc,elapsed,mode:"pencil"});localStorage.setItem("poorviMathHistory",JSON.stringify(h.slice(-100)));
     $("best").textContent=Math.max(acc,...h.map(x=>x.a||0))+"%";
     $("msg").textContent=up?"⏰ Time's up — handwriting was recognized and submitted automatically.":(recognized<Math.max(1,Math.floor(total*.6))?"⚠️ Some handwriting was hard to read. Review the ? answers.":acc===100?"🎉 Perfect!":acc>=90?"⭐ Excellent!":"👍 Keep practicing!");
     $("ocrProgress").textContent="Done — "+recognized+" handwriting answers recognized.";
   }catch(e){
     $("score").textContent="Submitted";$("acc").textContent="—";$("used").textContent=Math.floor(elapsed/60)+":"+String(elapsed%60).padStart(2,"0");$("best").textContent="—";
     $("msg").textContent="⚠️ Automatic handwriting recognition was unavailable. The written answers are still on the page for parent review.";
     $("ocrProgress").textContent="Recognition unavailable.";
   }
   $("ocrStatus").classList.add("hidden");$("result").classList.remove("hidden");renderWeek();
 }else{
   let n=0;
   document.querySelectorAll(".ans").forEach((e,i)=>{let ok=e.value.trim()!==""&&+e.value===qs[i].ans,f=$("f"+i);f.textContent=ok?"✓":(e.value.trim()===""?"•":"✗");f.className="fb "+(ok?"ok":"bad");e.disabled=true;if(ok)n++});
   let total=qs.length,a=Math.round(n/total*100);
   $("score").textContent=n+" / "+total;$("acc").textContent=a+"%";$("used").textContent=Math.floor(elapsed/60)+":"+String(elapsed%60).padStart(2,"0");
   let h=JSON.parse(localStorage.getItem("poorviMathHistory")||"[]");h.push({date:key(),n,total,a,elapsed,mode:"keyboard"});localStorage.setItem("poorviMathHistory",JSON.stringify(h.slice(-100)));
   $("best").textContent=Math.max(a,...h.map(x=>x.a||0))+"%";$("msg").textContent=up?"⏰ Time's up — submitted automatically.":a===100?"🎉 Perfect!":a>=90?"⭐ Excellent!":"👍 Keep practicing!";
   $("result").classList.remove("hidden");renderWeek();
 }
}
function blankCanvas(c){
 const ctx=c.getContext("2d"),d=ctx.getImageData(0,0,c.width,c.height).data;let ink=0;
 for(let i=0;i<d.length;i+=4)if(d[i+3]>20 && (d[i]<245||d[i+1]<245||d[i+2]<245))ink++;
 return ink<30;
}
function key(d=new Date()){return d.toISOString().slice(0,10)}
function weekDates(){let d=new Date(),day=d.getDay(),m=new Date(d);m.setDate(d.getDate()-(day===0?6:day-1));return Array.from({length:7},(_,i)=>{let x=new Date(m);x.setDate(m.getDate()+i);return x})}
function renderWeek(){let h=JSON.parse(localStorage.getItem("poorviMathHistory")||"[]"),map=Object.fromEntries(h.map(x=>[x.date,x]));$("week").innerHTML=weekDates().map(d=>{let x=map[key(d)],name=d.toLocaleDateString(undefined,{weekday:"short"});return'<div class="day '+(x?"done":"")+'"><b>'+name+'</b><strong>'+(x?x.a+"%":"—")+'</strong><span class="small">'+(x?x.n+"/"+x.total:"Not done")+'</span></div>'}).join("");$("summary").textContent=weekDates().filter(d=>map[key(d)]).length+" of 7 days completed this week."}
function parentLogin(){let p=prompt("Parent PIN");if(p==="2580"){document.getElementById("parentPanel").scrollIntoView({behavior:"smooth"});alert("Parent mode unlocked.");}else alert("Incorrect PIN.")}
function parentResults(){let p=prompt("Parent PIN");if(p!=="2580"){alert("Incorrect PIN.");return}$("result").classList.remove("hidden");$("result").scrollIntoView({behavior:"smooth"})}
function clearHistory(){if(prompt("Enter Parent PIN to clear history")!=="2580")return;localStorage.removeItem("poorviMathHistory");renderWeek();alert("History cleared.")}
function review(){let b=$("mistakes");b.innerHTML=qs.map((q,i)=>{let e=document.querySelector('[data-i="'+i+'"]');return e&&e.value.trim()!==""&&+e.value===q.ans?"":'<div>'+q.a+' '+sym(q.o)+' '+q.b+' = <b>'+q.ans+'</b></div>'}).join("");b.classList.toggle("hidden")}
$("answerMode").addEventListener("change",()=>{if(!started)newEdition()}); window.addEventListener("resize",fitGrid);window.addEventListener("orientationchange",()=>setTimeout(fitGrid,150));$("answerMode").addEventListener("change",()=>{if(!started)newEdition()});newEdition();renderWeek();fitGrid();
</script></body></html>
