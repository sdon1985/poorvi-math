<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Poorvi Math">
<meta name="theme-color" content="#ffffff">
<title>Poorvi Math Practice</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#16181b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:1100px;margin:auto;padding:14px 16px 35px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{margin:0;font-size:24px}.muted{color:#69717a;font-size:13px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #0000000a}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}
select,button{font:inherit}select{width:100%;padding:10px;border:1px solid #c9ced4;border-radius:9px;background:white}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:#2563eb;color:white}.secondary{background:#e9edf2}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.timer{font-size:27px;font-weight:800}.timer.warn{color:#c62828}
.sheet{background:#fff;border:1px solid #bbb}.sheethead{padding:13px;border-bottom:1px solid #777}.title{text-align:center;font-family:Georgia,serif;font-size:21px;font-weight:bold}
.info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;margin-top:12px;font-family:Georgia,serif;font-size:13px}.line{border-bottom:1px solid #444;display:inline-block;width:100px}
.grid{display:grid;grid-template-columns:repeat(10,1fr)}.cell{height:72px;border-right:1px solid #bbb;border-bottom:1px solid #bbb;display:flex;align-items:center;justify-content:center}.cell:nth-child(10n){border-right:0}
.q{font-family:Georgia,serif;font-size:17px;white-space:nowrap}.ans{width:45px;border:0;border-bottom:1px solid #444;background:transparent;text-align:center;font-size:17px;outline:none}
.feedback{font-size:11px;height:14px}.ok{color:#16803c}.bad{color:#c62828}
.result{text-align:center}.score{font-size:43px;font-weight:900}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.stat{background:#f0f2f4;border-radius:10px;padding:8px 14px}.stat b{font-size:20px;display:block}
.hidden{display:none!important}
@media(max-width:650px){.controls{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(5,1fr)}.cell:nth-child(10n){border-right:1px solid #bbb}.cell:nth-child(5n){border-right:0}.cell{height:78px}.q{font-size:14px}.ans{width:38px;font-size:15px}.info{gap:5px;font-size:11px}.line{width:65px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div><h1>📚 Poorvi Math Practice</h1><div class="muted">Daily worksheet • 100 questions • iPad friendly</div></div></div>

<div class="card">
<h2 style="margin:0 0 12px">Create Today's Practice</h2>
<div class="controls">
<div><label>Operation</label><select id="op"><option value="addition">Addition</option><option value="subtraction">Subtraction</option><option value="multiplication">Multiplication</option><option value="division">Division</option><option value="mixed">Mixed</option></select></div>
<div><label>Questions</label><select id="count"><option>100</option><option>50</option><option>25</option></select></div>
<div><label>Format</label><select id="format"><option value="horizontal">Side-by-side</option><option value="vertical">Vertical</option></select></div>
<div><label>Timer</label><select id="mins"><option value="4">4 minutes</option><option value="5">5 minutes</option><option value="0">No timer</option></select></div>
</div>
<div class="actions"><button class="primary" onclick="newSheet()">✨ New Edition</button><button class="secondary" onclick="start()">▶ Start</button><button class="secondary" onclick="finish()">✓ Score</button></div>
</div>

<div class="card" id="timerCard"><div style="display:flex;justify-content:space-between;align-items:center"><b>Timer</b><span class="timer" id="timer">4:00</span></div></div>

<div class="card"><div class="sheet" id="sheet"></div></div>

<div class="card hidden" id="resultCard"><div class="result">
<div class="muted">Today's Result</div><div class="score" id="score">0 / 100</div><p id="msg"></p>
<div class="stats"><div class="stat"><b id="acc">0%</b><span>Accuracy</span></div><div class="stat"><b id="time">0:00</b><span>Time</span></div></div>
<div class="actions" style="justify-content:center"><button class="primary" onclick="newSheet()">Practice New Edition</button></div>
</div></div>

<div class="card"><b>Weekly progress</b><div class="muted" id="history" style="margin-top:8px">No completed tests yet.</div></div>
</div>

<script>
let qs=[],started=false,submitted=false,left=240,timerId=null,startAt=0;
const $=x=>document.getElementById(x);
const R=n=>Math.floor(Math.random()*n);

function question(op){
 if(op==="mixed") op=["addition","subtraction","multiplication","division"][R(4)];
 let a,b,ans;
 if(op==="addition"){a=R(10);b=R(10);ans=a+b}
 if(op==="subtraction"){a=R(10);b=R(a+1);ans=a-b}
 if(op==="multiplication"){a=R(10);b=R(10);ans=a*b}
 if(op==="division"){b=1+R(9);ans=R(10);a=b*ans}
 return {a,b,ans,op}
}
function sym(op){return op==="addition"?"+":op==="subtraction"?"−":op==="multiplication"?"×":"÷"}
function newSheet(){
 clearInterval(timerId);started=false;submitted=false;left=(+$("mins").value||0)*60;updateTimer();
 const op=$("op").value,n=+$("count").value;qs=Array.from({length:n},()=>question(op));
 render();$("resultCard").classList.add("hidden");window.scrollTo({top:0,behavior:"smooth"});
}
function render(){
 const f=$("format").value==="vertical";
 $("sheet").innerHTML=`<div class="sheethead"><div class="title">${$("op").value==="mixed"?"Mixed Math Practice":$("op").value[0].toUpperCase()+$("op").value.slice(1)+" Practice"}</div>
 <div class="info"><div>Name: <span class="line"></span></div><div>Date: <span class="line"></span></div><div>Score: <span class="line"></span> / ${qs.length}</div></div></div>`;
 const g=document.createElement("div");g.className="grid";
 qs.forEach((q,i)=>{let c=document.createElement("div");c.className="cell";
 c.innerHTML=`<div><div class="q">${q.a} ${sym(q.op)} ${q.b} = <input class="ans" inputmode="numeric" data-i="${i}"></div><div class="feedback" id="f${i}"></div></div>`;g.appendChild(c)});
 $("sheet").appendChild(g);document.querySelector(".ans")?.focus();
}
function start(){if(started)return;started=true;submitted=false;startAt=Date.now();left=(+$("mins").value||0)*60;updateTimer();clearInterval(timerId);
 if(left)timerId=setInterval(()=>{left--;updateTimer();if(left<=0)finish(true)},1000)}
function updateTimer(){let m=Math.floor(left/60),s=left%60;$("timer").textContent=`${m}:${String(s).padStart(2,"0")}`;$("timer").classList.toggle("warn",left&&left<=30)}
function finish(timeup=false){if(submitted)return;submitted=true;started=false;clearInterval(timerId);
 let correct=0;document.querySelectorAll(".ans").forEach((e,i)=>{let ok=e.value.trim()!==""&&+e.value===qs[i].ans;let f=$("f"+i);f.textContent=ok?"✓":(e.value.trim()===""?"•":"✗");f.className="feedback "+(ok?"ok":"bad");if(ok)correct++});
 let total=qs.length,accuracy=Math.round(correct/total*100),elapsed=$("mins").value==="0"?Math.round((Date.now()-startAt)/1000):+$("mins").value*60-left;
 $("score").textContent=`${correct} / ${total}`;$("acc").textContent=accuracy+"%";$("time").textContent=`${Math.floor(elapsed/60)}:${String(elapsed%60).padStart(2,"0")}`;
 $("msg").textContent=timeup?"Time's up!":accuracy===100?"🎉 Perfect!":accuracy>=90?"⭐ Excellent work!":"👍 Keep practicing!";
 let h=JSON.parse(localStorage.getItem("poorviMath")||"[]");h.unshift({date:new Date().toLocaleDateString(),accuracy,correct,total});localStorage.setItem("poorviMath",JSON.stringify(h.slice(0,7)));renderHistory();
 $("resultCard").classList.remove("hidden");window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})
}
function renderHistory(){let h=JSON.parse(localStorage.getItem("poorviMath")||"[]");$("history").innerHTML=h.length?h.map(x=>`${x.date}: <b>${x.accuracy}%</b> (${x.correct}/${x.total})`).join(" &nbsp; • &nbsp; "):"No completed tests yet."}
newSheet();renderHistory();
</script>
</body></html>
